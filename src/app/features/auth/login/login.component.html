<div class="login-bg-container">
  <!-- TARJETA PRINCIPAL DE ACCESO -->
  <div class="login-card">
    
    <!-- Ícono verde de tienda en recuadro redondeado -->
    <div class="logo-box">
      <span class="material-symbols-outlined store-icon">storefront</span>
    </div>

    <!-- Título y subtítulo -->
    <h1 class="welcome-title">¡Bienvenido!</h1>
    <p class="welcome-subtitle">Ingresa a tu sistema TPV Minimarket / Tienda</p>

    <!-- Banner verde de estado -->
    <div *ngIf="statusMessage() && !errorMessage()" class="alert-status-green">
      <span class="material-symbols-outlined icon-check">check_circle</span>
      <span>{{ statusMessage() }}</span>
    </div>

    <!-- Alerta de Error si ocurre -->
    <div *ngIf="errorMessage()" class="alert-status-error">
      <span class="material-symbols-outlined icon-error">error</span>
      <span>{{ errorMessage() }}</span>
    </div>

    <!-- FORMULARIO DE ACCESO -->
    <form (ngSubmit)="onSubmit()" class="login-form">
      
      <!-- Campo Usuario o Correo -->
      <div class="form-group">
        <label class="input-label">Usuario o Correo</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined input-icon">person</span>
          <input 
            type="text" 
            [value]="loginId()" 
            (input)="loginId.set($any($event.target).value)" 
            class="form-control" 
            placeholder="admin o correo@ejemplo.com"
            required
          />
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div class="form-group">
        <div class="label-row">
          <label class="input-label">Contraseña</label>
          <a routerLink="/auth/forgot-password" class="link-forgot">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="input-wrapper">
          <span class="material-symbols-outlined input-icon">lock</span>
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            [value]="password()" 
            (input)="password.set($any($event.target).value)" 
            class="form-control" 
            placeholder="••••••••"
            required
          />
          <button type="button" class="btn-toggle-eye" (click)="togglePasswordVisibility()">
            <span class="material-symbols-outlined">
              {{ showPassword() ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>
      </div>

      <!-- Checkbox Recordarme -->
      <div class="remember-row">
        <label class="checkbox-container">
          <input 
            type="checkbox" 
            [checked]="rememberMe()" 
            (change)="rememberMe.set($any($event.target).checked)"
          />
          <span class="checkbox-label">Recordarme</span>
        </label>
      </div>

      <!-- BOTÓN PRINCIPAL: Ingresar al Sistema -->
      <button type="submit" class="btn-login-green" [disabled]="isLoading()">
        <span class="material-symbols-outlined btn-icon">login</span>
        <span *ngIf="!isLoading()">Ingresar al Sistema</span>
        <span *ngIf="isLoading()">Verificando...</span>
      </button>

      <!-- BOTÓN REQUERIDO: Entrar como Invitado -->
      <button type="button" class="btn-guest-outline" [disabled]="isLoading()" (click)="enterAsGuest()">
        <span class="material-symbols-outlined btn-icon">visibility</span>
        <span>Entrar como Invitado</span>
      </button>

    </form>

    <!-- CAJA INFORMATIVA DE CREDENCIALES POR DEFECTO -->
    <div class="default-credentials-box">
      <div class="cred-header">
        <span class="material-symbols-outlined icon-info">info</span>
        <span>Credenciales por defecto:</span>
      </div>
      <div class="cred-row">
        <span class="cred-label">Usuario:</span> <span class="cred-value">{{ loginId() }}</span>
      </div>
      <div class="cred-row">
        <span class="cred-label">Contraseña:</span> <span class="cred-value">admin123</span>
      </div>

      <!-- SELECTOR RÁPIDO PARA PROBAR LOS ROLES -->
      <div class="demo-chips-grid">
        <button type="button" class="chip-btn" [class.active]="loginId() === '1001' || loginId() === 'admin'" (click)="selectDemo('admin')">
          Administrador
        </button>
        <button type="button" class="chip-btn" [class.active]="loginId() === '2001'" (click)="selectDemo('empleado')">
          Empleado
        </button>
        <button type="button" class="chip-btn" [class.active]="loginId() === 'atelier@maison.com'" (click)="selectDemo('cliente')">
          Cliente
        </button>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="card-footer">
      <p>© 2026 TPV Minimarket - Sistema de Gestión</p>
    </div>

  </div>
</div>
