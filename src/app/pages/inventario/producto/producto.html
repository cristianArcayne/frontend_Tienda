<mat-card>
  <mat-card-header>
    <div class="page-header">
      <mat-card-title>Gestión de Productos</mat-card-title>
      <button *ngIf="puedeCrear" mat-raised-button color="primary" (click)="crearProducto()">
        <mat-icon class="m-r-8">add</mat-icon>
        Crear Nuevo Producto
      </button>
    </div>
  </mat-card-header>

  <mat-card-content>
    <div *ngIf="isLoading" class="d-flex justify-content-center p-y-40">
      <mat-spinner diameter="50"></mat-spinner>
    </div>

    <div *ngIf="!isLoading && dataSource.length > 0" class="table-responsive">
      <table mat-table [dataSource]="dataSource" class="w-full">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let element">{{ element.id }}</td>
        </ng-container>

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let element">{{ element.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="categoria_nombre">
          <th mat-header-cell *matHeaderCellDef>Categoría</th>
          <td mat-cell *matCellDef="let element">{{ element.categoria_nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="marca_nombre">
          <th mat-header-cell *matHeaderCellDef>Marca</th>
          <td mat-cell *matCellDef="let element">{{ element.marca_nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="imagenes">
          <th mat-header-cell *matHeaderCellDef>Imagen</th>
          <td mat-cell *matCellDef="let element">
            <div style="display: flex; align-items: center; justify-content: center; width: 50px; height: 50px; background: #f1f5f9; border-radius: 6px; overflow: hidden; border: 1px solid #e2e8f0;">
              <img *ngIf="getImagenPrincipal(element)" 
                   [src]="getImagenPrincipal(element)" 
                   (error)="onImgError($event)"
                   alt=""
                   style="width: 100%; height: 100%; object-fit: cover; display: block;">
              <mat-icon *ngIf="!getImagenPrincipal(element)" 
                       style="font-size: 26px; width: 26px; height: 26px; color: #94a3b8;">
                checkroom
              </mat-icon>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let element">
            <button
              *ngIf="puedeVerDetalle"
              mat-icon-button
              matTooltip="Ver Detalles"
              (click)="verDetalles(element)"
              color="accent">
              <mat-icon>visibility</mat-icon>
            </button>
            <button
              *ngIf="puedeEditar"
              mat-icon-button
              matTooltip="Editar"
              (click)="editarProducto(element)"
              color="primary">
              <mat-icon>edit</mat-icon>
            </button>
            <button
              *ngIf="puedeEliminar"
              mat-icon-button
              matTooltip="Eliminar"
              (click)="eliminarProducto(element)"
              color="warn">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <div *ngIf="!isLoading && dataSource.length === 0" class="empty-state">
      <mat-icon class="empty-icon">info</mat-icon>
      <p class="empty-text">No hay productos disponibles</p>
    </div>

    <mat-paginator
      *ngIf="dataSource.length > 0"
      [length]="totalItems"
      [pageSize]="pageSize"
      hidePageSize="true"
      (page)="onPageChange($event)">
    </mat-paginator>
  </mat-card-content>
</mat-card>
